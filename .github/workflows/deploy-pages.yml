# نشر الموقع الثابت (Astro) على GitHub Pages
#
# المصدر الوحيد للنشر هنا: GitHub Actions (وليس بناء Jekyll التلقائي).
# المسار المنشور: https://j9724000j-hash.github.io/Dr_S/
#   (SITE_URL + SITE_BASE مضبوطان صراحةً في env أدناه — لأن الافتراضي العام في
#    astro.config.mjs هو جذر النطاق "/" المناسب لـ Netlify و Hostinger)
# النشر على Netlify مُعدّ في netlify.toml ولا علاقة له بهذا الملف.
#
# قاعدة الأمان (SEC-002 في تقرير التدقيق):
#   النشر الحي يحدث من فرع main فقط. دفع أي فرع جلسة (arena/*) لا يُنشر على الموقع
#   العام، فلا يستطيع فرع غير مراجَع استبدال المحتوى المنشور.
#   للتجربة قبل الدمج: شغّل البناء محلياً (npm run build && npm run verify).
name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# صلاحيات النشر القياسية لـGitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# نشر واحد في كل مرة (لا نُلغِ عملية نشر جارية)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (npm ci + astro build)
    runs-on: ubuntu-latest
    env:
      # معاينة GitHub Pages تحت مسار المستودع — مضبوطة هنا صراحةً حتى لا تعتمد
      # على أي افتراضي في astro.config.mjs (الافتراضي هناك هو جذر النطاق "/").
      SITE_URL: https://j9724000j-hash.github.io
      SITE_BASE: /Dr_S
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # المشروع يشترط node >= 22.12.0 (package.json → engines)
          node-version: '22'
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build static site (npm run build)
        run: npm run build

      - name: Verify build output (كل رابط محلي له ملف فعلي)
        run: npm run verify

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages (main)
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
